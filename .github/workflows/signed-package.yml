name: Release APK package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !github.event.deleted)
    uses: ./.github/workflows/android-build.yml
    with:
      delivery: release
    secrets:
      TICBOX_SIGNING_STORE_BASE64: ${{ secrets.TICBOX_SIGNING_STORE_BASE64 }}
      TICBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TICBOX_SIGNING_STORE_PASSWORD }}
      TICBOX_SIGNING_KEY_ALIAS: ${{ secrets.TICBOX_SIGNING_KEY_ALIAS }}
      TICBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TICBOX_SIGNING_KEY_PASSWORD }}
      TICBOX_SIGNING_CERT_SHA256: ${{ secrets.TICBOX_SIGNING_CERT_SHA256 }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.sha }}
          path: release-assets
      - name: Verify the downloaded release pair
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_CERTIFICATE: ${{ secrets.TICBOX_SIGNING_CERT_SHA256 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('release-assets/manifest.json', 'utf8'));
          assert.equal(manifest.schema, 'ticbox-apk-delivery/v1');
          assert.equal(manifest.variant, 'release');
          assert.equal(manifest.commit, process.env.SOURCE_COMMIT);
          assert.equal(`v${manifest.version}`, process.env.RELEASE_TAG);
          assert.equal(manifest.apks.length, 2);
          assert.deepEqual(manifest.apks.map(apk => apk.name).sort(), ['phone', 'watch']);
          const certificate = process.env.EXPECTED_CERTIFICATE.replace(/[:\s]/g, '').toLowerCase();
          for (const apk of manifest.apks) {
            assert.match(apk.path, /^ticbox-(phone|healthbridge)-[A-Za-z0-9.-]+\.apk$/);
            assert.equal(apk.variant, 'release');
            assert.equal(apk.debuggable, false);
            assert.equal(apk.versionName, manifest.version);
            assert.equal(apk.certificate, certificate);
            const digest = createHash('sha256').update(fs.readFileSync(`release-assets/${apk.path}`)).digest('hex');
            assert.equal(digest, apk.sha256);
          }
          NODE
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The English notes when there are some, for the release page; otherwise the Chinese ones beside them.
          notes="docs/releases/en/${RELEASE_TAG#v}.md"
          [ -f "$notes" ] || notes="docs/releases/${RELEASE_TAG#v}.md"
          note_args=(--generate-notes)
          if [ -f "$notes" ]; then note_args=(--notes-file "$notes"); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" "${note_args[@]}" release-assets/*.apk release-assets/SHA256SUMS.txt release-assets/manifest.json release-assets/README.txt
          gh release edit "$RELEASE_TAG" --draft=false
